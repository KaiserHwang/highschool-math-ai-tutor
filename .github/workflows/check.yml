name: 문제·앱 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 정답 독립 검증
        run: |
          pip install sympy
          python3 tests/verify_answers.py
      - name: 수식·HTML·캐시 목록 검사
        run: node tests/content-check.mjs
      - name: 브라우저 종단 테스트
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 &
          sleep 2
          node tests/e2e.mjs
